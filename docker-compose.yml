services:
  relay:
    build: ./server
    container_name: screen-relay
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data        # список зрителей бота
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "127.0.0.1:${RELAY_PORT:-8090}:8000"   # наружу только через Caddy
