<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0e0f12; --fg:#e8e8ea; --muted:#8a8d96; --ok:#2ecc71; --bad:#e74c3c; --warn:#f1c40f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; display:flex; gap:12px; align-items:center;
    padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top));
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); z-index:2; font-size:13px; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  #state { font-weight:600; }
  .muted { color:var(--muted); }
  #spacer { flex:1; }
  button { background:#2a2d35; color:var(--fg); border:0; border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; height:100%; object-fit:contain; display:block; }
  #stale { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.45); font-size:16px; z-index:1; pointer-events:none; }
  #login { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:3; background:var(--bg); }
  #login form { display:flex; flex-direction:column; gap:10px; width:min(320px, 90vw); }
  #login input { padding:10px; border-radius:8px; border:1px solid #333; background:#17191e; color:var(--fg); font:inherit; }
  #login .err { color:var(--bad); min-height:1em; }
  /* admin control mode: tap on the picture = click on the PC */
  #ctlBtn { display:none; }
  #panel { position:fixed; left:0; right:0; bottom:0; display:none; flex-direction:column; gap:8px; z-index:2;
    padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:rgba(0,0,0,.8); }
  #panel .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #panel input { flex:1; min-width:120px; padding:7px 9px; border-radius:8px; border:1px solid #333;
    background:#17191e; color:var(--fg); font:inherit; }
  #ctlMsg { font-size:13px; min-height:1.3em; }
  #saveRow { display:none; }
  body.ctl #panel { display:flex; }
  body.ctl #stage { top:44px; bottom:var(--panel-h, 150px); }
  body.ctl canvas { cursor:crosshair; touch-action:manipulation; }
  body.ctl #stale { display:none !important; }
  body.ctl #ctlBtn { background:var(--ok); color:#000; }
  #mark { position:fixed; width:34px; height:34px; margin:-17px 0 0 -17px; border:3px solid var(--ok);
    border-radius:50%; pointer-events:none; opacity:0; z-index:2; }
  #mark.on { animation:ping .7s ease-out; }
  @keyframes ping { from { opacity:1; transform:scale(.4); } to { opacity:0; transform:scale(1.5); } }
</style>
</head>
<body>
<div id="bar">
  <div id="dot"></div><span id="state">Подключение…</span>
  <span id="fps" class="muted"></span>
  <span id="spacer"></span>
  <button id="ctlBtn" title="Управление: нажать в окне на ПК">🎮</button>
  <button id="fs" title="Во весь экран">⛶</button>
</div>
<div id="panel">
  <div id="ctlMsg">Подключаюсь…</div>
  <div class="row" id="tapRow"></div>
  <form class="row" id="saveRow">
    <input id="saveName" maxlength="24" placeholder="Название кнопки, например «Закрыть рекламу»">
    <button type="submit">Сохранить</button>
  </form>
  <div class="row">
    <button id="escBtn">⬅️ Назад</button>
    <button id="saveBtn">💾 Сохранить точку кнопкой</button>
    <span style="flex:1"></span>
    <button id="ctlClose">✖ Выйти</button>
  </div>
</div>
<div id="mark"></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="stale">Нет сигнала от ПК</div>
<div id="login">
  <form id="loginForm">
    <div>Введите ключ доступа</div>
    <input id="keyInput" type="password" autocomplete="current-password" required>
    <button type="submit">Смотреть</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  if (inTelegram) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0e0f12'); tg.setBackgroundColor('#0e0f12'); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const KEY_STORE = 'relay_view_key';

  const store = {
    get() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return memKey; } },
    set(v) { memKey = v; try { localStorage.setItem(KEY_STORE, v); } catch (e) {} },
    clear() { memKey = ''; try { localStorage.removeItem(KEY_STORE); } catch (e) {} },
  };
  let memKey = '';

  let ws = null, backoff = 500, frames = 0, lastFrameAt = 0, decoding = false, pending = null;
  let lastMsgAt = 0, serverLive = false, guestUntil = null, ended = false;
  let ctl = null, ctlOn = false, lastTap = null, tapBusy = 0;
  let wantCtl = new URLSearchParams(location.search).get('control') === '1';
  const guest = new URLSearchParams(location.search).get('g');

  function setState(text, color) { $('state').textContent = text; $('dot').style.background = color; }

  async function draw(blob, fromCtl) {
    if (ctlOn !== !!fromCtl) {                  // control mode shows the whole window instead of the stream
      if (!fromCtl) lastFrameAt = performance.now();
      return;
    }
    if (decoding) { pending = blob; return; }   // keep only the newest frame
    decoding = true;
    try {
      const bmp = await createImageBitmap(blob);
      if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      frames++; lastFrameAt = performance.now();
    } catch (e) { /* broken frame, skip */ }
    decoding = false;
    if (pending) { const b = pending; pending = null; draw(b, ctlOn); }
  }

  function showLogin(msg) {
    $('login').style.display = 'flex';
    $('loginErr').textContent = msg || '';
    $('keyInput').focus();
  }

  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    store.set($('keyInput').value.trim());
    $('login').style.display = 'none';
    connect();
  });

  function connect() {
    if (ended) return;
    let auth;
    if (guest) auth = { guest };
    else if (inTelegram) auth = { initData: tg.initData };
    else {
      const k = store.get();
      if (!k) { showLogin(); return; }
      auth = { key: k };
    }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'blob';
    let authed = false;

    ws.onopen = () => ws.send(JSON.stringify(auth));
    ws.onmessage = ev => {
      if (typeof ev.data !== 'string') { lastMsgAt = performance.now(); draw(ev.data); return; }
      lastMsgAt = performance.now();
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'auth') {
        if (!m.ok) {
          authed = false;
          if (m.reason === 'expired') {
            ended = true;
            setState('Ссылка истекла', 'var(--bad)');
            $('fps').textContent = '';
            ctx.clearRect(0, 0, cv.width, cv.height);
            $('stale').textContent = 'Время гостевого доступа вышло. Попроси новую ссылку.';
            $('stale').style.display = 'flex';
            return;
          }
          if (m.reason === 'full') { setState('Слишком много зрителей', 'var(--bad)'); return; }
          if (inTelegram) {
            setState('Нет доступа', 'var(--bad)');
            $('stale').textContent = 'Нет доступа. Закрой окно и нажми Start в боте: владельцу придёт запрос.';
            $('stale').style.display = 'flex';
            return;
          }
          store.clear(); showLogin('Неверный ключ'); return;
        }
        authed = true; backoff = 500; guestUntil = m.until || null; setState('Ожидание кадров…', 'var(--warn)');
        if (m.admin && inTelegram) {
          $('ctlBtn').style.display = 'block';
          if (wantCtl) { wantCtl = false; ctlStart(); }
        }
      } else if (m.type === 'status') {
        const live = m.online && m.age !== null && m.age < 5;
        serverLive = live;
        setState(live ? 'LIVE' : (m.online ? 'ПК подключён, нет кадров' : 'ПК не в сети'),
                 live ? 'var(--ok)' : 'var(--bad)');
        $('stale').style.display = live ? 'none' : 'flex';
      }
    };
    ws.onclose = ev => {
      ws = null;
      if (ended || ev.code === 4403 || ev.code === 4429 || ev.code === 4410) return;   // handled above
      setState('Переподключение…', 'var(--warn)');
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }

  // ---------------------------------------------------------------- admin control mode
  const ctlMsg = (t, color) => { $('ctlMsg').textContent = t; $('ctlMsg').style.color = color || 'var(--fg)'; };
  const fitPanel = () => document.body.style.setProperty('--panel-h', $('panel').offsetHeight + 'px');

  function renderTaps(taps) {
    const row = $('tapRow');
    row.textContent = '';
    (taps || []).forEach(t => {
      const b = document.createElement('button');
      b.textContent = '🖱 ' + t.name;
      b.addEventListener('click', () => sendTap(t.x, t.y, null));
      row.appendChild(b);
    });
    fitPanel();
  }

  function ctlSend(obj) {
    if (ctl && ctl.readyState === WebSocket.OPEN) { ctl.send(JSON.stringify(obj)); return true; }
    ctlMsg('Нет связи с сервером', 'var(--bad)');
    return false;
  }

  function sendTap(x, y, ev) {
    if (Date.now() - tapBusy < 15000) return;          // one click at a time
    if (!ctlSend({ type: 'tap', x, y })) return;
    tapBusy = Date.now();
    lastTap = { x, y };
    ctlMsg('Нажимаю на ПК…', 'var(--warn)');
    if (ev) {
      const mk = $('mark');
      mk.style.left = ev.clientX + 'px'; mk.style.top = ev.clientY + 'px';
      mk.classList.remove('on'); void mk.offsetWidth; mk.classList.add('on');
    }
  }

  cv.addEventListener('click', ev => {
    if (!ctlOn || !cv.width) return;
    const r = cv.getBoundingClientRect();                // the picture is letterboxed inside the canvas box
    const k = Math.min(r.width / cv.width, r.height / cv.height);
    const w = cv.width * k, h = cv.height * k;
    const x = (ev.clientX - r.left - (r.width - w) / 2) / w;
    const y = (ev.clientY - r.top - (r.height - h) / 2) / h;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    sendTap(x, y, ev);
  });

  function ctlConnect() {
    if (!ctlOn) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ctl = new WebSocket(`${proto}://${location.host}/control`);
    ctl.binaryType = 'blob';
    ctl.onopen = () => ctl.send(JSON.stringify({ initData: tg.initData }));
    ctl.onmessage = ev => {
      if (typeof ev.data !== 'string') { draw(ev.data, true); return; }
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'auth') {
        if (!m.ok) { ctlMsg('Управление доступно только админу', 'var(--bad)'); return; }
        renderTaps(m.taps);
        ctlMsg('Нажми на картинку: кликну в это же место на ПК.');
      } else if (m.type === 'status') {
        if (!m.online) ctlMsg('ПК не в сети', 'var(--bad)');
        else if (!m.supported) ctlMsg('Обнови программу на ПК до 0.1.6 («Проверить обновления»)', 'var(--bad)');
      } else if (m.type === 'result') {
        tapBusy = 0;
        ctlMsg((m.ok ? '✅ ' : '⚠️ ') + m.msg, m.ok ? 'var(--ok)' : 'var(--bad)');
      } else if (m.type === 'taps') {
        renderTaps(m.taps);
        ctlMsg(m.saved === false ? 'Кнопок слишком много, удали лишние в боте' :
               'Готово: кнопки есть в боте в «🎮 Управление»', m.saved === false ? 'var(--bad)' : 'var(--ok)');
      }
    };
    ctl.onclose = ev => {
      ctl = null;
      if (ctlOn && ev.code !== 4403) setTimeout(ctlConnect, 1500);
    };
  }

  function ctlStart() {
    if (ctlOn) return;
    ctlOn = true; pending = null; tapBusy = 0;
    document.body.classList.add('ctl');
    ctlMsg('Подключаюсь…');
    fitPanel();
    ctlConnect();
  }

  function ctlStop() {
    ctlOn = false; pending = null;
    document.body.classList.remove('ctl');
    $('saveRow').style.display = 'none';
    if (ctl) { try { ctl.close(); } catch (e) {} }
  }

  $('ctlBtn').addEventListener('click', () => ctlOn ? ctlStop() : ctlStart());
  $('ctlClose').addEventListener('click', ctlStop);
  $('escBtn').addEventListener('click', () => {
    if (Date.now() - tapBusy < 15000) return;
    if (ctlSend({ type: 'key', key: 'esc' })) { tapBusy = Date.now(); ctlMsg('Нажимаю «Назад» на ПК…', 'var(--warn)'); }
  });
  $('saveBtn').addEventListener('click', () => {
    if (!lastTap) { ctlMsg('Сначала нажми на картинке в нужное место, потом сохраняй.', 'var(--warn)'); return; }
    $('saveRow').style.display = 'flex';
    fitPanel();
    $('saveName').focus();
  });
  $('saveRow').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('saveName').value.trim();
    if (!name || !lastTap) return;
    if (ctlSend({ type: 'save', name, x: lastTap.x, y: lastTap.y })) {
      $('saveName').value = '';
      $('saveRow').style.display = 'none';
      fitPanel();
    }
  });

  // watchdog: the connection looks open but nothing arrives (sleeping phone, stuck proxy) -> reconnect
  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const now = performance.now();
    const silent = lastMsgAt && now - lastMsgAt > 8000;                 // server sends status every 2 s
    const frozen = serverLive && lastFrameAt && now - lastFrameAt > 10000;
    if (silent || frozen) { try { ws.close(); } catch (e) {} }
  }, 2000);

  setInterval(() => {
    let left = '';
    if (guestUntil && !ended) {
      const s = Math.max(0, Math.round(guestUntil - Date.now() / 1000));
      left = ` · гость, осталось ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }
    $('fps').textContent = (frames ? `${frames} fps` : '') + left;
    frames = 0;
  }, 1000);

  $('fs').addEventListener('click', () => {
    if (inTelegram && tg.requestFullscreen) { try { tg.isFullscreen ? tg.exitFullscreen() : tg.requestFullscreen(); return; } catch (e) {} }
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !ws) connect();
  });

  connect();
})();
</script>
</body>
</html>
